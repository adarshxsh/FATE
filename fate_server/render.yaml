services:
  - type: web
    name: fate-telemetry-server
    env: python
    buildCommand: "pip install -r fate_server/requirements.txt"
    startCommand: "cd fate_server && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
