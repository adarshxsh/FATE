# Render Blueprint: the API runs on Render (free web service), and Postgres
# lives on Neon (free tier, no 30-day expiry). Neon project config is in
# neon.ts.
#
# DATABASE_URL is a secret: set it in Render → fate-server → Environment
# with the Neon *pooled* connection string (host contains "-pooler",
# ends with ?sslmode=require). Never commit it to this file.
#
# Deploy: Render dashboard → New → Blueprint → pick this repo/branch.
services:
  - type: web
    name: fate-server
    runtime: python
    plan: free
    rootDir: fate_server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false   # Render prompts for it on first Blueprint apply
      - key: ENABLE_LEGACY_API
        value: "false"
