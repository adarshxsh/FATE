name: fate_app
description: Full Attention Telemetry Engine
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  flutter_bloc: ^8.1.3
  dio: ^5.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.65.0
  google_sign_in: ^6.1.5
  permission_handler: ^11.0.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/fate_app_icon.png"
  min_sdk_size: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/fate_logo.svg
    - assets/icons/fate_app_icon.svg
